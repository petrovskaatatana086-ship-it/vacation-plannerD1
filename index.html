<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Vacation Planner</title>
  <style>
    :root{
      --bg:#eef3fb;--panel:#ffffff;--text:#0f172a;--muted:#64748b;--line:#dbe4f0;--blue:#2563eb;--blue2:#1d4ed8;--green:#16a34a;--red:#dc2626;--amber:#d97706;--side:#0f172a;--sideText:#e2e8f0;
    }
    [data-theme="dark"]{--bg:#0b1220;--panel:#111827;--text:#f8fafc;--muted:#94a3b8;--line:#263449;--side:#0b1220;--sideText:#e2e8f0;}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
    button,input,select,textarea{font:inherit} button{cursor:pointer;border:0} input,select,textarea{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;padding:12px;outline:none} textarea{min-height:110px;resize:vertical}
    .app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.sidebar{background:var(--side);color:var(--sideText);padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-weight:900;font-size:22px;margin:4px 6px 24px}.nav{display:flex;flex-direction:column;gap:12px}.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:18px;background:transparent;color:var(--sideText);font-weight:800;text-align:left}.nav button.active{background:var(--blue);color:white;box-shadow:0 12px 30px rgba(37,99,235,.25)}.nav button:hover:not(.active){background:#1e293b}.main{padding:28px;max-width:1240px;width:100%;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.title h1{margin:0;font-size:34px}.title p{margin:7px 0 0;color:var(--muted)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;gap:16px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:0 12px 35px rgba(15,23,42,.06)}.card h2,.card h3{margin:0 0 14px}.btn{border-radius:14px;padding:11px 14px;font-weight:800;background:#e2e8f0;color:#0f172a}.btn.primary{background:var(--blue);color:white}.btn.green{background:var(--green);color:white}.btn.red{background:var(--red);color:white}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.btn.small{padding:7px 10px;border-radius:10px;font-size:13px}.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;background:#e2e8f0;color:#0f172a;padding:6px 10px;font-size:13px;font-weight:800}.dark .pill,[data-theme="dark"] .pill{background:#1f2937;color:#e5e7eb}.list{display:flex;flex-direction:column;gap:10px}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:18px;padding:12px;background:rgba(148,163,184,.08)}.item.done .item-title{text-decoration:line-through;color:var(--muted)}.item-title{font-weight:800}.muted{color:var(--muted)}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border-radius:999px;padding:9px 13px;background:#e2e8f0;color:#0f172a;font-weight:800}.tabs button.active{background:var(--blue);color:white}.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-box{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:26px;padding:22px;max-width:520px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 25px 80px rgba(0,0,0,.35)}.form{display:grid;gap:12px}.stat{border-radius:20px;padding:16px;background:rgba(37,99,235,.1);border:1px solid rgba(37,99,235,.18)}.stat b{font-size:22px}.ok{color:var(--green);font-weight:900}.bad{color:var(--red);font-weight:900}.warn{color:var(--amber);font-weight:900}.offline{position:fixed;right:16px;bottom:16px;background:#111827;color:#fff;border-radius:14px;padding:10px 12px;font-weight:800;display:none}.offline.show{display:block}.empty{border:1px dashed var(--line);border-radius:18px;padding:18px;text-align:center;color:var(--muted)}
    @media(max-width:860px){.app{grid-template-columns:1fr}.sidebar{height:auto;position:relative}.nav{display:grid;grid-template-columns:1fr 1fr}.main{padding:18px}.grid2,.grid3{grid-template-columns:1fr}.top{flex-direction:column}.title h1{font-size:28px}}
  </style>
</head>
<body>
<div id="app"></div><div id="offline" class="offline">Офлайн: открыто последнее сохранение</div>
<script>
(() => {
  const STORAGE_KEY = 'vacation-planner-d1-v2';
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  const money = v => (Number(v)||0).toLocaleString('ru-RU', {maximumFractionDigits:2}) + ' ₽';
  const budgetCats = ['Транспорт','Жилье','Питание','Развлечения','Покупки','Аптека','Другое'];
  const defaultMedFolders = ['Обезболивающие','От живота','Простуда','Аллергия','Перевязочные материалы','Другое'];
  const state = loadState();

  function newTrip(name='Лазурный Берег', date='2026-07-15'){
    return { id:uid(), name, date, archived:false, archivedAt:null,
      tasks:[{id:uid(),title:'Проверить документы и бронирования',time:'За 30 дней',done:false},{id:uid(),title:'Загрузить офлайн-карты',time:'За 7 дней',done:false}],
      packingCats:['Мои вещи','Документы','Техника','Разное'], activePackingCat:'Документы',
      packing:[{id:uid(),title:'Загранпаспорт и копии документов',cat:'Документы',done:false},{id:uid(),title:'Зарядные устройства и адаптеры',cat:'Техника',done:false}],
      medkit: defaultMedFolders.map(n=>({id:uid(),name:n,items:[]})), activeMedFolder:'Обезболивающие',
      notes:[{id:uid(),title:'Полезные контакты',content:'Отель:\nСтраховая:',cat:'Важное'}],
      details:{hotel:'',tickets:'',insurance:'',contacts:''},
      itinerary:[{id:uid(),day:'День 1',time:'12:00',title:'Старт поездки',content:'Добавьте перелёт, трансфер, отель и первые планы.'}],
      budgetPlan:[{id:uid(),title:'Жилье',amount:0,category:'Жилье'}], budgetFact:[],
      lastMinute:[{id:uid(),title:'Утюг выключен',done:false},{id:uid(),title:'Окна закрыты',done:false},{id:uid(),title:'Вода перекрыта',done:false},{id:uid(),title:'Мусор вынесен',done:false}]
    };
  }
  function defaultState(){ const t = newTrip(); return {version:2, theme:'dark', section:'home', trips:[t], activeTripId:t.id, noteCats:['Адреса','Покупки','Локации','Важное']}; }
  function migrate(s){
    if(!s || !Array.isArray(s.trips)) return defaultState();
    s.version = 2; s.theme ||= 'dark'; s.section ||= 'home'; s.noteCats ||= ['Адреса','Покупки','Локации','Важное'];
    s.trips = s.trips.map(t => ({...newTrip(t.name||'Поездка', t.date||''), ...t,
      packingCats:(t.packingCats||['Мои вещи','Документы','Техника','Разное']).filter(c=>c!=='Аптечка'),
      packing:(t.packing||t.packingList||[]).filter(i=>i.cat!=='Аптечка').map(i=>({id:i.id||uid(), title:i.title||i.item||'', cat:i.cat||'Разное', done:!!(i.done||i.checked)})),
      tasks:(t.tasks||[]).map(i=>({id:i.id||uid(),title:i.title||'',time:i.time||'В планах',done:!!(i.done||i.completed)})),
      medkit:t.medkit||defaultMedFolders.map(n=>({id:uid(),name:n,items:[]})),
      activeMedFolder:t.activeMedFolder||'Обезболивающие',
      budgetPlan:t.budgetPlan||[], budgetFact:t.budgetFact||t.budget||[], details:t.details||{hotel:'',tickets:'',insurance:'',contacts:''}
    }));
    if(!s.activeTripId && s.trips[0]) s.activeTripId=s.trips[0].id; return s;
  }
  function loadState(){ try{return migrate(JSON.parse(localStorage.getItem(STORAGE_KEY)))}catch(e){return defaultState()} }
  function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  function activeTrip(){ return state.trips.find(t=>t.id===state.activeTripId) || state.trips.find(t=>!t.archived) || state.trips[0]; }
  function setSection(sec){ state.section=sec; render(); }
  function updateTrip(id, patch){ const i=state.trips.findIndex(t=>t.id===id); if(i>-1) state.trips[i]={...state.trips[i],...patch}; render(); }
  function mutateTrip(fn){ const t=activeTrip(); if(!t) return; fn(t); render(); }
  function render(){ document.documentElement.dataset.theme=state.theme; save(); document.getElementById('app').innerHTML = layout(); bind(); }

  function layout(){ const t=activeTrip(); const archivedCount=state.trips.filter(x=>x.archived).length; return `<div class="app"><aside class="sidebar"><div class="brand">✈️ Vacation Planner</div><div class="nav">
    ${nav('home','🏠','Главный экран')}${nav('tasks','📌','План подготовки')}${nav('packing','🧳','Чек-лист вещей')}${nav('medkit','💊','Аптечка')}${nav('details','📝','Детали поездки')}${nav('budget','💰','Бюджет')}${nav('archive','📦','Архив ('+archivedCount+')')}
    </div></aside><main class="main"><div class="top"><div class="title"><h1>${escapeHtml(title())}</h1><p>${t?escapeHtml(t.name)+' · '+escapeHtml(t.date||'без даты'):'Создайте поездку'}</p></div><div class="row"><button class="btn ghost" data-action="theme">${state.theme==='dark'?'☀️ Светлая':'🌙 Тёмная'}</button><button class="btn primary" data-modal="trip">+ Поездка</button></div></div>${content()}</main></div>${modalHtml()}`; }
  function nav(sec,icon,label){return `<button class="${state.section===sec?'active':''}" data-sec="${sec}"><span>${icon}</span><span>${label}</span></button>`}
  function title(){ return {home:'Главный экран',tasks:'План подготовки',packing:'Чек-лист вещей',medkit:'Аптечка',details:'Детали поездки',budget:'Бюджет',archive:'Архив'}[state.section] || 'Vacation Planner'; }
  function content(){ const t=activeTrip(); if(!t) return `<div class="empty">Нет поездок</div>`; return ({home:home,tasks:tasks,packing:packing,medkit:medkit,details:details,budget:budget,archive:archive}[state.section]||home)(t); }

  function home(t){ const totalTasks=t.tasks.length, doneTasks=t.tasks.filter(i=>i.done).length, totalPack=t.packing.length, donePack=t.packing.filter(i=>i.done).length, totalMeds=t.medkit.flatMap(f=>f.items).length, doneMeds=t.medkit.flatMap(f=>f.items).filter(i=>i.done).length; return `<div class="grid grid3"><div class="stat"><div class="muted">Подготовка</div><b>${doneTasks}/${totalTasks}</b></div><div class="stat"><div class="muted">Вещи</div><b>${donePack}/${totalPack}</b></div><div class="stat"><div class="muted">Аптечка</div><b>${doneMeds}/${totalMeds}</b></div></div><br><div class="card"><h2>Поездка</h2><div class="grid grid2"><div><b>Название:</b><br>${escapeHtml(t.name)}</div><div><b>Дата:</b><br>${escapeHtml(t.date||'не указана')}</div></div><br><div class="row"><button class="btn primary" data-modal="editTrip">Редактировать поездку</button><button class="btn red" data-action="archiveTrip">Отправить в архив</button></div></div>`; }
  function tasks(t){ const groups=['В планах','За 30 дней','За 14 дней','За 7 дней','24 часа']; return `<div class="card"><div class="row"><input id="taskTitle" placeholder="Новая задача"><select id="taskTime">${groups.map(g=>`<option>${g}</option>`).join('')}</select><button class="btn primary" data-action="addTask">Добавить</button></div></div><br><div class="grid grid2">${groups.map(g=>`<div class="card"><h3>${g}</h3><div class="list">${items(t.tasks.filter(i=>i.time===g),'task')}</div></div>`).join('')}</div>`; }
  function packing(t){ const active=t.activePackingCat||t.packingCats[0]; return `<div class="card"><div class="tabs">${t.packingCats.map(c=>`<button class="${c===active?'active':''}" data-pack-cat="${escapeAttr(c)}">${escapeHtml(c)}</button>`).join('')}</div><div class="row"><input id="packTitle" placeholder="Что взять"><button class="btn primary" data-action="addPack">Добавить</button></div></div><br><div class="card"><div class="list">${items(t.packing.filter(i=>i.cat===active),'pack')}</div></div>`; }
  function medkit(t){ const active=t.activeMedFolder||t.medkit[0]?.name; const folder=t.medkit.find(f=>f.name===active)||t.medkit[0]; const total=t.medkit.reduce((s,f)=>s+(f.items?.length||0),0); return `<div class="grid grid2"><div class="card"><h3>Папки</h3><div class="tabs">${t.medkit.map(f=>`<button class="${f.name===folder.name?'active':''}" data-med-folder="${escapeAttr(f.name)}">${escapeHtml(f.name)}</button>`).join('')}</div><div class="row"><input id="newMedFolder" placeholder="Новая папка"><button class="btn primary" data-action="addMedFolder">Создать папку</button></div><br><div class="row"><input id="renameMedFolder" value="${escapeAttr(folder.name)}"><button class="btn ghost" data-action="renameMedFolder">Переименовать</button><button class="btn red" data-action="deleteMedFolder">Удалить</button></div><br><h3>Добавить препарат</h3><div class="row"><input id="medTitle" placeholder="Название препарата"><button class="btn primary" data-action="addMed">Добавить</button></div><p class="muted">Препарат добавится в выбранную папку: <b>${escapeHtml(folder.name)}</b></p></div><div class="card"><h3>Список аптечки</h3><p class="muted">Все папки и препараты в одном чек-листе. Отмечайте, что уже взяли.</p><div class="list">${total?medkitChecklist(t):'<div class="empty">Пока нет препаратов. Выберите папку слева и добавьте название.</div>'}</div></div></div>`; }
  function details(t){ return `<div class="grid grid2"><div class="card"><h3>Детали поездки</h3><div class="form"><input data-detail="hotel" placeholder="Отель / адрес" value="${escapeAttr(t.details.hotel)}"><input data-detail="tickets" placeholder="Билеты / рейсы" value="${escapeAttr(t.details.tickets)}"><input data-detail="insurance" placeholder="Страховка" value="${escapeAttr(t.details.insurance)}"><textarea data-detail="contacts" placeholder="Контакты и важная информация">${escapeHtml(t.details.contacts)}</textarea></div></div><div class="card"><h3>Маршрут</h3><div class="row"><input id="routeDay" placeholder="День"><input id="routeTime" placeholder="Время"><input id="routeTitle" placeholder="Событие"><button class="btn primary" data-action="addRoute">Добавить</button></div><br><div class="list">${t.itinerary.map(r=>`<div class="item"><div><b>${escapeHtml(r.day)} ${escapeHtml(r.time)}</b><br>${escapeHtml(r.title)}<br><span class="muted">${escapeHtml(r.content||'')}</span></div><button class="btn small red" data-del-route="${r.id}">×</button></div>`).join('')||'<div class="empty">Маршрут пуст</div>'}</div></div></div>`; }

  function medkitChecklist(t){ return t.medkit.map(f=>`<div class="card" style="box-shadow:none;padding:14px;border-radius:18px"><div class="row" style="justify-content:space-between;margin-bottom:8px"><b>📁 ${escapeHtml(f.name)}</b><span class="pill">${(f.items||[]).filter(i=>i.done).length}/${(f.items||[]).length}</span></div><div class="list">${(f.items||[]).map(i=>`<div class="item ${i.done?'done':''}"><label class="row" style="flex:1;cursor:pointer"><input style="width:auto" type="checkbox" ${i.done?'checked':''} data-toggle-med-all="${i.id}" data-med-folder-id="${f.id}"><span class="item-title">${escapeHtml(i.title)}</span></label><button class="btn small ${i.done?'primary':'ghost'}" data-toggle-med-btn="${i.id}" data-med-folder-id="${f.id}">${i.done?'✓ взяла':'не взяла'}</button></div>`).join('')||'<div class="empty">В этой папке пока пусто</div>'}</div></div>`).join(''); }
  function budget(t){ const plan=sumBudget(t.budgetPlan), fact=sumBudget(t.budgetFact), diff=plan-fact; const status=diff>=0?'Уложилась':'Превышение бюджета'; return `<div class="grid grid3"><div class="stat"><div class="muted">Приблизительный бюджет</div><b>${money(plan)}</b></div><div class="stat"><div class="muted">Фактически потрачено</div><b>${money(fact)}</b></div><div class="stat"><div class="muted">Разница</div><b class="${diff>=0?'ok':'bad'}">${diff>=0?'+':''}${money(diff)}</b><br><span class="${diff>=0?'ok':'bad'}">${status}</span></div></div><br><div class="grid grid2"><div class="card"><h3>Приблизительный бюджет</h3>${budgetForm('plan')}<br><div class="list">${budgetItems(t.budgetPlan,'plan')}</div></div><div class="card"><h3>Фактический бюджет</h3>${budgetForm('fact')}<br><div class="list">${budgetItems(t.budgetFact,'fact')}</div></div></div>`; }
  function budgetForm(type){return `<div class="row"><input id="${type}Title" placeholder="Категория/трата"><input id="${type}Amount" type="number" placeholder="Сумма ₽"><select id="${type}Cat">${budgetCats.map(c=>`<option>${c}</option>`).join('')}</select><button class="btn primary" data-action="addBudget" data-budget-type="${type}">Добавить</button></div>`}
  function archive(){ const arch=state.trips.filter(t=>t.archived); return `<div class="card"><h2>Архив</h2><div class="list">${arch.map(t=>`<div class="item"><div><div class="item-title">${escapeHtml(t.name)}</div><div class="muted">${escapeHtml(t.date||'без даты')}</div></div><div class="row"><button class="btn small ghost" data-open-trip="${t.id}">Открыть</button><button class="btn small green" data-restore-trip="${t.id}">Вернуть</button></div></div>`).join('')||'<div class="empty">Архив пуст</div>'}</div></div>`; }
  function items(arr,type){ return arr.map(i=>`<div class="item ${i.done?'done':''}"><label class="row" style="flex:1"><input style="width:auto" type="checkbox" ${i.done?'checked':''} data-toggle-${type}="${i.id}"><span class="item-title">${escapeHtml(i.title)}</span></label><button class="btn small red" data-del-${type}="${i.id}">×</button></div>`).join('') || '<div class="empty">Пока пусто</div>'; }
  function budgetItems(arr,type){ return arr.map(i=>`<div class="item"><div><div class="item-title">${escapeHtml(i.title)}</div><span class="muted">${escapeHtml(i.category)} · ${money(i.amount)}</span></div><button class="btn small red" data-del-budget="${i.id}" data-budget-list="${type}">×</button></div>`).join('') || '<div class="empty">Пока пусто</div>'; }
  function sumBudget(arr){ return (arr||[]).reduce((s,i)=>s+(Number(i.amount)||Number(i.cost)||0),0); }

  let modal=null;
  function modalHtml(){ if(!modal) return ''; const t=activeTrip(); if(modal==='trip') return `<div class="modal"><div class="modal-box"><h2>Новая поездка</h2><div class="form"><input id="tripName" placeholder="Название поездки"><input id="tripDate" type="date"><div class="row"><button class="btn primary" data-action="createTrip">Создать</button><button class="btn ghost" data-action="closeModal">Отмена</button></div></div></div></div>`; if(modal==='editTrip') return `<div class="modal"><div class="modal-box"><h2>Редактировать поездку</h2><div class="form"><input id="editTripName" value="${escapeAttr(t.name)}"><input id="editTripDate" type="date" value="${escapeAttr(t.date)}"><div class="row"><button class="btn primary" data-action="saveTrip">Сохранить</button><button class="btn red" data-action="archiveTrip">Отправить в архив</button><button class="btn ghost" data-action="closeModal">Отмена</button></div></div></div></div>`; }

  function bind(){
    document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>setSection(b.dataset.sec));
    document.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>{modal=b.dataset.modal;render();});
    document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>actions(b.dataset.action,b));
    document.querySelectorAll('[data-pack-cat]').forEach(b=>b.onclick=()=>mutateTrip(t=>t.activePackingCat=b.dataset.packCat));
    document.querySelectorAll('[data-med-folder]').forEach(b=>b.onclick=()=>mutateTrip(t=>t.activeMedFolder=b.dataset.medFolder));
    ['task','pack','med'].forEach(type=>{document.querySelectorAll(`[data-toggle-${type}]`).forEach(el=>el.onchange=()=>toggleItem(type,el.dataset[`toggle${cap(type)}`]));document.querySelectorAll(`[data-del-${type}]`).forEach(el=>el.onclick=()=>deleteItem(type,el.dataset[`del${cap(type)}`]));});
    document.querySelectorAll('[data-toggle-med-all]').forEach(el=>el.onchange=()=>toggleMedInFolder(el.dataset.medFolderId, el.dataset.toggleMedAll));
    document.querySelectorAll('[data-toggle-med-btn]').forEach(el=>el.onclick=()=>toggleMedInFolder(el.dataset.medFolderId, el.dataset.toggleMedBtn));
    document.querySelectorAll('[data-del-budget]').forEach(el=>el.onclick=()=>mutateTrip(t=>{const list=el.dataset.budgetList==='plan'?'budgetPlan':'budgetFact';t[list]=t[list].filter(i=>i.id!==el.dataset.delBudget);}));
    document.querySelectorAll('[data-detail]').forEach(el=>el.oninput=()=>{ const t=activeTrip(); t.details[el.dataset.detail]=el.value; save(); });
    document.querySelectorAll('[data-del-route]').forEach(el=>el.onclick=()=>mutateTrip(t=>t.itinerary=t.itinerary.filter(r=>r.id!==el.dataset.delRoute)));
    document.querySelectorAll('[data-open-trip]').forEach(el=>el.onclick=()=>{state.activeTripId=el.dataset.openTrip;state.section='home';render();});
    document.querySelectorAll('[data-restore-trip]').forEach(el=>el.onclick=()=>{const t=state.trips.find(x=>x.id===el.dataset.restoreTrip); if(t){t.archived=false;t.archivedAt=null;state.activeTripId=t.id;state.section='home';render();}});
  }
  function actions(a, btn){ const t=activeTrip();
    if(a==='theme'){state.theme=state.theme==='dark'?'light':'dark';render()} if(a==='closeModal'){modal=null;render()}
    if(a==='createTrip'){const name=val('tripName')||'Новая поездка';const nt=newTrip(name,val('tripDate'));state.trips.unshift(nt);state.activeTripId=nt.id;modal=null;state.section='home';render()}
    if(a==='saveTrip'){updateTrip(t.id,{name:val('editTripName')||t.name,date:val('editTripDate')});modal=null;render()}
    if(a==='archiveTrip'){t.archived=true;t.archivedAt=new Date().toISOString();modal=null;const next=state.trips.find(x=>!x.archived);state.activeTripId=next?next.id:t.id;state.section='archive';render()}
    if(a==='addTask'){mutateTrip(t=>{const title=val('taskTitle'); if(title)t.tasks.push({id:uid(),title,time:val('taskTime'),done:false});})}
    if(a==='addPack'){mutateTrip(t=>{const title=val('packTitle'); if(title)t.packing.push({id:uid(),title,cat:t.activePackingCat||t.packingCats[0],done:false});})}
    if(a==='addMedFolder'){mutateTrip(t=>{const name=val('newMedFolder'); if(name&&!t.medkit.some(f=>f.name===name)){t.medkit.push({id:uid(),name,items:[]});t.activeMedFolder=name;}})}
    if(a==='renameMedFolder'){mutateTrip(t=>{const old=t.activeMedFolder; const name=val('renameMedFolder'); if(!name)return; const f=t.medkit.find(x=>x.name===old); if(f){f.name=name;t.activeMedFolder=name;}})}
    if(a==='deleteMedFolder'){mutateTrip(t=>{if(t.medkit.length<=1)return; t.medkit=t.medkit.filter(f=>f.name!==t.activeMedFolder); t.activeMedFolder=t.medkit[0].name;})}
    if(a==='addMed'){mutateTrip(t=>{const title=val('medTitle'); const f=t.medkit.find(x=>x.name===t.activeMedFolder)||t.medkit[0]; if(title&&f)f.items.push({id:uid(),title,done:false});})}
    if(a==='addBudget'){const type=btn.dataset.budgetType; mutateTrip(t=>{const title=val(type+'Title'); const amount=Number(val(type+'Amount'))||0; if(title||amount){t[type==='plan'?'budgetPlan':'budgetFact'].push({id:uid(),title:title||'Без названия',amount,category:val(type+'Cat')});}})}
    if(a==='addRoute'){mutateTrip(t=>{const title=val('routeTitle'); if(title)t.itinerary.push({id:uid(),day:val('routeDay')||'День',time:val('routeTime')||'',title,content:''});})}
  }
  function toggleItem(type,id){ mutateTrip(t=>{ const arr = type==='task'?t.tasks:type==='pack'?t.packing:(t.medkit.find(f=>f.name===t.activeMedFolder)||{}).items||[]; const it=arr.find(i=>i.id===id); if(it)it.done=!it.done; }); }
  function deleteItem(type,id){ mutateTrip(t=>{ if(type==='task')t.tasks=t.tasks.filter(i=>i.id!==id); if(type==='pack')t.packing=t.packing.filter(i=>i.id!==id); if(type==='med'){const f=t.medkit.find(x=>x.name===t.activeMedFolder); if(f)f.items=f.items.filter(i=>i.id!==id);} }); }

  function toggleMedInFolder(folderId,id){ mutateTrip(t=>{ const f=t.medkit.find(x=>x.id===folderId); const it=f?.items?.find(i=>i.id===id); if(it)it.done=!it.done; }); }
  function deleteMedInFolder(folderId,id){ mutateTrip(t=>{ const f=t.medkit.find(x=>x.id===folderId); if(f)f.items=f.items.filter(i=>i.id!==id); }); }
  function val(id){return (document.getElementById(id)?.value||'').trim()} function cap(s){return s[0].toUpperCase()+s.slice(1)}
  function escapeHtml(s=''){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))} function escapeAttr(s=''){return escapeHtml(s).replace(/'/g,'&#39;')}
  window.addEventListener('online',()=>document.getElementById('offline').classList.remove('show')); window.addEventListener('offline',()=>document.getElementById('offline').classList.add('show')); if(!navigator.onLine) document.getElementById('offline').classList.add('show');
  if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{})); }
  render();
})();
</script>
</body>
</html>
